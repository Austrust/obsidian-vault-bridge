name: Prepare draft release
on:
  push:
    tags: ['0.*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  draft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Check tag and manifest agree
        shell: pwsh
        run: |
          $manifestVersion = (Get-Content manifest.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $manifestVersion) { throw 'Tag must exactly match manifest.version' }
      - run: node build.cjs
      - run: npm run check
      - run: npm test
      - run: git diff --exit-code -- main.js
      - run: node scripts/package.cjs
      - name: Attest plugin release files
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/${{ github.ref_name }}/main.js
            dist/${{ github.ref_name }}/manifest.json
            dist/${{ github.ref_name }}/styles.css
      - name: Verify build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          foreach ($releaseFile in @('main.js', 'manifest.json', 'styles.css')) {
            gh attestation verify "dist/$env:GITHUB_REF_NAME/$releaseFile" --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Attestation verification failed: $releaseFile" }
          }
      - name: Prepare reviewable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME
          gh release create $releaseVersion "dist/$releaseVersion/main.js" "dist/$releaseVersion/manifest.json" "dist/$releaseVersion/styles.css" --verify-tag --draft --title "VaultBridge Agent $releaseVersion" --notes-file "docs/RELEASE-$releaseVersion.md"
