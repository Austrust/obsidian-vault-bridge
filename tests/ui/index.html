<!doctype html><html lang="zh"><meta charset="utf-8"><title>VaultBridge UI regression</title><link rel="stylesheet" href="styles.css"><style>
:root{--font-interface:system-ui;--text-muted:#737373;--text-faint:#999;--background-secondary:#f6f6f6;--background-modifier-border:#e8e8e8;--interactive-accent:#765de5}*{box-sizing:border-box}body{font:14px system-ui;background:#e8edf4;margin:20px}#frame{width:400px;height:800px;position:relative;float:right;background:white}#leaf{height:100%;width:100%}.status-bar{position:absolute;bottom:0;right:0;width:100%;height:32px;background:#ccd6e5;z-index:20;padding:7px}button{cursor:pointer;border:1px solid #ccc;border-radius:5px;background:white}textarea{font:inherit}#history{display:flex;flex-direction:column;max-width:500px;gap:12px}#tools{max-width:520px}.na-header h3{font-size:18px}.theme-dark{--background-primary:#202020;--background-secondary:#292929;--text-normal:#eee;--text-muted:#aaa;--text-faint:#777;--background-modifier-border:#383838}.theme-dark #frame{background:#202020}.theme-dark .status-bar{background:#292929;color:#aaa}</style>
<div id="frame"><div id="leaf"></div><div class="status-bar">Obsidian 状态栏（模拟覆盖区域）</div></div><div id="tools"><h1>VaultBridge UI regression</h1><button id="git-test">Git 检查点测试</button><button id="permission-test">权限询问测试</button><button id="dark">深色主题</button><button id="error">连接错误</button><button id="update">更新思考片段</button><button id="short">短窗口</button><button id="history-test">测试旧历史标题</button><p>已发送：<span id="sent"></span></p><p id="result"></p><p>复制结果（Electron clipboard 测试替身）：</p><textarea id="copied" aria-label="复制结果"></textarea><button id="select-body">选中正文</button><button id="clear-selection">取消选中</button><div id="history"></div></div><script src="marked.js"></script><script src="harness.js"></script><script src="plugin.js"></script><script src="fixture.js"></script></html>
